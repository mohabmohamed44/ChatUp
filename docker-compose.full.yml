# Full-stack local verification: app images + local deps.
#
# Build + run everything (first build takes a while — npm ci + next build):
#   docker compose -f docker-compose.full.yml up --build -d
# Then verify (see checklist at the bottom), then tear down:
#   docker compose -f docker-compose.full.yml down        # keep data
#   docker compose -f docker-compose.full.yml down -v     # full reset
#
# Base deps (postgres :5432, redis :6379, fake-gcs :4443) come from
# docker-compose.yml via `include`, so this file only adds the two app
# services. Do NOT edit docker-compose.yml for this — it stays the
# `npm run dev` dependency set. Ports are fixed (3000 web / 4000 api).
#
# URL split (why two vars): the browser socket connects from YOUR machine
# (NEXT_PUBLIC_SOCKET_URL=http://localhost:4000) while the web container
# proxies /api/* server-side over the compose network
# (NEXT_PUBLIC_API_URL=http://server:4000). See apps/web/Dockerfile +
# src/shared/lib/socket.ts. NEXT_PUBLIC_* bake into the web image at build
# time; the runtime ENV below covers the server-side rewrite proxy.
# SESSION_SECRET: override via env, or the insecure local default applies
# (local-only, never use in production).

include:
  - path: docker-compose.yml

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: chatup-server:local
    container_name: chatup_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gcs:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://chatup:chatup_dev_password@postgres:5432/chatup?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-insecure-secret-min-32-chars}
      CORS_ORIGIN: http://localhost:3000
      GCS_PROJECT_ID: chatup-dev
      GCS_BUCKET: chatup-media
      GCS_EMULATOR_URL: http://gcs:4443
      MEDIA_URL_TTL_SECONDS: 900
      APP_URL: http://localhost:3000
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://server:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        # Non-empty local placeholders: empty build-arg values are rejected
        # by the builder, and push stays disabled without a real VAPID key.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-local}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-local}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-local}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-local}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-local}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-local}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-local}
    image: chatup-web:local
    container_name: chatup_web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Server-side rewrite proxy (/api/* → server:4000); client bundle values
      # come from the build args above.
      NEXT_PUBLIC_API_URL: http://server:4000
    ports:
      - '3000:3000'

# VERIFY CHECKLIST (the "is Docker working" test):
#   1. docker context use default   # avoid the dual-daemon port clash
#   2. docker compose -f docker-compose.full.yml up --build -d
#   3. docker compose -f docker-compose.full.yml ps
#      → all 5 services Up (postgres/gcs/server "healthy")
#   4. curl -s localhost:4000/healthz   → {"status":"ok"}
#      curl -s localhost:4000/readyz    → {"status":"ok",...} (DB reachable)
#      curl -s -o /dev/null -w '%{http_code}\n' localhost:3000/  → 200
#   5. docker logs chatup_server | head → "migrate deploy" applied, then
#      "ChatUp server listening" on port 4000 (no EADDRINUSE, no 500s)
#   6. Browser: http://localhost:3000 → register 2 users → start 1:1 →
#      text realtime (no refresh) → image + voice → refresh keeps history →
#      presence/typing → failed-send retry → non-member gets 403
#   7. Rebuild sanity after code changes: --build, then repeat 3-5.
